worker_processes auto; # 建议改为 auto，充分利用 2 核
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    multi_accept on;           # 强烈推荐：每个 worker 一次性 accept 多个新连接，适合 WS 突发
    use epoll;                 # 显式指定
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    charset utf-8;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;
    keepalive_timeout 75s;
    gzip on;

    proxy_read_timeout 3600s;      # location 里加（或 server/http 全局）：WS 读超时 1 小时，防空闲杀连接
    proxy_send_timeout 3600s;      # 同上：写超时 1 小时
    proxy_connect_timeout 60s;     # 连接后端 sing-box 的超时，保持默认或稍大

    access_log off;
    error_log logs/error.log error;

    # 兜底 Server：直接拒绝未匹配的 SNI 握手，防主动探测，无需配证书
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        ssl_reject_handshake on;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name $USER_DOMAIN;

        ssl_certificate $CERT_PATH;
        ssl_certificate_key $KEY_PATH;

        # 现代 SSL 配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        root /data/www/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # WebSocket 代理：极简配置
        location /$PROXY_PATH {
            proxy_pass http://127.0.0.1:10086;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            
            proxy_buffering off;
            proxy_read_timeout     1800s;     # 30 分钟，够日常挂机（后台不操作也稳）
            proxy_send_timeout     1800s;     # 同上
            proxy_connect_timeout  30s;       # 降点，本地连接超快
        }

        # 订阅与更新接口
        location = /subscribe {
            # 强制禁用缓存，确保订阅实时性
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";

            client_max_body_size 1m;          # 允许上传最大 1MB 的配置
            client_body_buffer_size 1m;      # 内存缓冲区大小
            client_body_in_single_buffer on; # 尽量放在单个缓冲区

            content_by_lua_block {
                local args = ngx.req.get_uri_args()
                local token = args["token"]
                local os_type = args["os"] or "universal" 
                
                -- 配置你生成的随机 Token
                local expected_token = "$URL_TOKEN"

                -- 1. 安全校验
                if token ~= expected_token then
                    ngx.status = 403
                    ngx.say("Forbidden")
                    return ngx.exit(403)
                end

                -- 2. 文件路径映射
                local base_path = "/data/www/subscribe/"
                local files = {
                    pc   = base_path .. "pc.json",
                    android = base_path .. "android.json",
                    universal = base_path .. "universal.txt"
                }

                local target_file = files[os_type]
                if not target_file then
                    ngx.status = 400
                    ngx.say("Invalid OS type")
                    return
                end

                local method = ngx.req.get_method()

                -- 3. PUT 方法：上传/更新配置文件
                if method == "PUT" then
                    ngx.req.read_body()
                    local data = ngx.req.get_body_data()
                    if not data then
                        ngx.status = 400
                        ngx.say("Empty body")
                        return
                    end

                    local file, err = io.open(target_file, "w")
                    if not file then
                        ngx.log(ngx.ERR, "File open error: ", err)
                        ngx.status = 500
                        ngx.say("Server Error: Cannot write file")
                        return
                    end
                    file:write(data)
                    file:close()
                    ngx.say("Update " .. os_type .. " success")

                -- 4. GET 方法：供客户端拉取配置
                elseif method == "GET" then
                    local file = io.open(target_file, "r")
                    if not file then
                        ngx.status = 404
                        ngx.say("Config not found")
                        return
                    end
                    local content = file:read("*all")
                    file:close()

                    -- 1. 获取文件名（从路径中截取最后一部分）
                    local filename = target_file:match("([^/]+)$")

                    -- 2. 设置 Header
                    ngx.header.content_type = "application/json; charset=utf-8"
                    -- 保持文件名与服务器文件名完全一致
                    ngx.header["Content-Disposition"] = "attachment; filename=" .. filename
                    ngx.print(content)
                else
                    ngx.exit(405)
                end
            }
        }

        location ^~ /subscribe/ {
            deny all;
        }
    }
}